{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to access your LendCircle account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-pill-signup btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem; text-align: center;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--green-main); font-weight: 600;">Create one here</a>
    </div>
  </div>
</div>
{% endblock %}
