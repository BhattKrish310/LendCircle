{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800;">Get Started with LendCircle</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join as a verified borrower or individual lender</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label">I want to join as a:</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <label style="border: 2px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background-color: var(--bg-surface);">
            <input type="radio" name="role" value="borrower" checked required>
            <div>
              <strong>Borrower</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted);">Request and repay loans</div>
            </div>
          </label>

          <label style="border: 2px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background-color: var(--bg-surface);">
            <input type="radio" name="role" value="lender" required>
            <div>
              <strong>Lender</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted);">Invest and earn interest</div>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="full_name" class="form-label">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Ananya Sharma" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Mobile Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 9876543210" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
        Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
